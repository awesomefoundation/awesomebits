      headline: Յուրաքանչյուրը կարող է ստեղծել Օսմ հիմնադրամի մասնաճյուղ
      intro: |
        Օսմ հիմնադրամը իրականում սովորական հիմնադրամ չէ. այն տեղական նախաձեռնությունների շարժում է։ Մեր համաշխարհային համայնքը կազմված է հրաշալի մարդկանցից, որոնք որոշել են իրենց համայնքները մի քիչ ավելի հիանալի դարձնել։ Նրանք համախմբվում են՝ կազմելու, գործարկելու եւ վարելու իրենց մասնաճյուղերը։

        Գուցե կողմնակալ ենք, բայց կարծում ենք, որ դա շատ հետաքրքիր է։ Մասնաճյուղերը ամբողջ աշխարհում օգնել են իրականացնել զարմանալի նախագծեր՝ [հսկայական ցանցաճոճ կառուցելուց](/en/projects/188-the-big-hammock) եւ [հանրային վայրերում ճոճանակներ տեղադրելուց](/en/projects/2598-swings) մինչեւ [շներին պոկեր խաղալ օգնելը](/en/projects/50233-dogs-playing-poker-live) եւ [յուրաքանչյուրին մեկ օրով Ինդիանա Ջոնս դառնալու հնարավորություն տալը](/en/projects/5071-indiana-jones-and-the-alley-of-doom)։

        **Հիանալի՞ է հնչում։ Կարդացեք շարունակությունը՝ իմանալու համար, թե ինչպես կարող եք ստեղծել ձեր սեփական մասնաճյուղը։**
      photo_alt_0: Սինգապուրի մասնաճյուղից երկու մարդ կանգնած են "Awesome Wanted" գրությամբ պաստառի առաջ
      photo_alt_1: Հոգաբարձուները դիտում են ներկայացում 2019 թվականի համաշխարհային հավաքին, իսկ խոսնակի հետեւում երեւում է "Celebrating 10 Years" գրությունը
      photo_alt_2: Ամստերդամի մասնաճյուղից երեք կին պահում են "Ik Maak Leiden Awesomûrrr" գրությամբ պաստառ
      steps_headline: Հինգ պարզ քայլ
      steps_intro: Օսմ հիմնադրամի նոր մասնաճյուղ գործարկելը պարզ է. մենք սիրում ենք ամեն ինչ պարզ պահել։
      existing_chapters_header: Ուսումնասիրեք գործող մասնաճյուղերը
      existing_chapters_text: Օսմ հիմնադրամի մասնաճյուղեր կան ամբողջ աշխարհում, ուստի հնարավոր է, որ ձեր տարածքում արդեն մասնաճյուղ կա։ Ստուգեք վերեւի «Մասնաճյուղեր» ցանկը եւ, եթե մոտակայքում մասնաճյուղ գտնեք, կապ հաստատեք նրանց հետ։
      handbook_header: Ներբեռնեք ուղեցույցը
      handbook_text: Սկսելուն օգնելու համար մենք հավաքել ենք 2009 թվականից ի վեր հազարավոր դրամաշնորհներ տրամադրելու ընթացքում ձեռք բերած փորձը եւ այն ներառել մեր [Նոր մասնաճյուղի ուղեցույցում](https://wiki.awesomestudies.org/images/9/92/Awesome_Foundation_New_Chapter_Handbook.pdf)։ Ներբեռնեք եւ կարդացեք այն՝ հասկանալու համար, թե ինչ է պետք սեփական մասնաճյուղ ստեղծելու համար։ Արեք դա հիմա. մենք կսպասենք։
      contact_header: Կապ հաստատեք
      contact_text: Այսպիսով, դուք կարդացել եք ուղեցույցը եւ պատրաստ եք սկսել։ Հիանալի է։ Գրեք join@awesomefoundation.org հասցեին եւ պատմեք, թե ով եք դուք եւ որտեղ եք սկսում ձեր մասնաճյուղը։ Մենք ձեզ կկապենք Օսմ հիմնադրամի համաշխարհային համայնքի հետ եւ կպատասխանենք ձեր հարցերին մասնաճյուղը գործարկելու վերաբերյալ։
      trustees_header: Հավաքեք ձեր հոգաբարձուներին
      trustees_text: Հոգաբարձուները յուրաքանչյուր մասնաճյուղի հիմքում են։ Նրանք ամեն ամիս գումար են ներդնում (սովորաբար 100 դոլար կամ տեղական համարժեքը) եւ որոշում են յուրաքանչյուր դրամաշնորհի հաղթողին։ Ձեր գործն է գտնել այդ մարդկանց եւ համախմբել նրանց։ Երբ հավաքեք ձեր թիմի մեծ մասը, տեղեկացրեք մեզ, եւ մենք ձեզ կավելացնենք մեր կայքում, որպեսզի կարողանաք սկսել դրամաշնորհային հայտեր ընդունել։
      launch_header: Գործարկեք
      launch_text: Շնորհավորում ենք։ Դուք այժմ Օսմ հիմնադրամի շարժման մաս եք։ Պատմեք բոլորին ձեր նոր մասնաճյուղի մասին եւ սկսեք ֆինանսավորել այն, ինչը հրաշալի է, գեղեցիկ եւ, կարելի է ասել, հիանալի ձեր համայնքում։
